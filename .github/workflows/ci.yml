name: CI - Gestión del Agua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  setup:
    name: 🔧 Configuración
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Usar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm install --legacy-peer-deps

  calidad:
    name: 📊 Calidad de Código
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Usar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar
      run: npm install --legacy-peer-deps

    - name: Verificar con Prettier
      run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

    - name: Ejecutar ESLint
      run: npx eslint "src/**/*.ts" "test/**/*.ts"

    - name: Verificar TypeScript
      run: npx tsc --noEmit --strict

    - name: Buscar console.log
      run: |
        if grep -r "console\.log" src/ --include="*.ts"; then
          echo "❌ Hay console.log"
          exit 1
        fi

  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: calidad
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: water_management_test
        ports: [5432:5432]

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Usar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar
      run: npm install --legacy-peer-deps

    - name: Configurar entorno
      run: |
        echo "DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/water_management_test" >> $GITHUB_ENV
        echo "NODE_ENV=test" >> $GITHUB_ENV
        echo "JWT_SECRET=test" >> $GITHUB_ENV

    - name: Ejecutar tests
      run: npm test

  seguridad:
    name: 🔒 Seguridad
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Usar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar para auditoría
      run: npm install --legacy-peer-deps --no-audit

    - name: Auditoría de dependencias
      run: npm audit --audit-level=high

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [tests, seguridad]
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Usar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar
      run: npm install --legacy-peer-deps

    - name: Construir
      run: npm run build

    - name: Verificar build
      run: |
        if [ -f "dist/main.js" ]; then
          echo "✅ Build exitoso"
        else
          echo "❌ Build falló"
          exit 1
        fi