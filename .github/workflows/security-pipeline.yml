# .github/workflows/ci.yml o security-pipeline.yml
name: Security CI

on: [push, pull_request]

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies WITH legacy-peer-deps
      run: |
        echo "Instalando dependencias con legacy-peer-deps..."
        npm ci --legacy-peer-deps
    
    - name: Run security audit
      run: |
        echo "🔍 Ejecutando auditoría de seguridad..."
        # Solo verificar, no intentar fix automático
        npm audit --audit-level=moderate || echo "Vulnerabilidades encontradas"
        
    - name: Check specific vulnerabilities
      run: |
        echo "Verificando js-yaml específicamente..."
        npm list js-yaml 2>/dev/null || echo "js-yaml no instalado"
        
    - name: Build project
      run: npm run build
      
    - name: Run tests
      run: npm test