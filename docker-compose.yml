version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: aguasegura-db
    environment:
      POSTGRES_DB: aguasegura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aguasegura-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    container_name: aguasegura-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      DATABASE_NAME: aguasegura
      JWT_SECRET: aguasegura_secret_key_2024_docker
      NODE_ENV: development
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - aguasegura-network
    command: npm run start:dev

volumes:
  postgres_data:

networks:
  aguasegura-network:
    driver: bridge