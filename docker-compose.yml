version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aguasegura-db
    environment:
      POSTGRES_DB: aguasegura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aguasegura-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev
      - prod

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aguasegura-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: aguasegura
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aguasegura-network
    profiles:
      - dev
      - prod

volumes:
  postgres_data:

networks:
  aguasegura-network:
    driver: bridge
