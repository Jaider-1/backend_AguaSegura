services:
  postgres:
    image: postgres:15-alpine
    container_name: aguasegura-db-prod
    environment:
      POSTGRES_DB: aguasegura
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - aguasegura-network-prod
    restart: unless-stopped
    # Añadir healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .  # <-- Importante: construir desde Dockerfile
    container_name: aguasegura-backend-prod
    environment:
      # Usar el nombre del servicio como host
      DB_HOST: postgres  # <-- Clave: usar el nombre del servicio
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: aguasegura
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      DB_SYNCHRONIZE: "false"  # En producción debe ser false
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy  # Esperar a que postgres esté saludable
    networks:
      - aguasegura-network-prod
    restart: unless-stopped

volumes:
  postgres_data_prod:

networks:
  aguasegura-network-prod:
    driver: bridge