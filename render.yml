services:
  - type: web
    name: aguasegura-backend
    env: node
    buildCommand: npm ci && npm run build
    # Ejecuta migraciones compiladas (JS) antes de arrancar para asegurar esquema actualizado
    # Utiliza el JS compilado en `dist` para evitar depender de `ts-node` en producción.
    startCommand: node dist/database/scripts/run-migrations.js && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aguasegura-db
          property: connectionString
    healthCheckPath: /api
    autoDeploy: true

databases:
  - name: aguasegura_bd
    databaseName: aguasegura_bd
    user: saido
    plan: free